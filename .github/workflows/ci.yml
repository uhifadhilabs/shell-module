name: CI

# Gatekeeper: every push and pull request must pass the full standard
# (code style -> static analysis -> tests) before it is valid for review.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    # NO DATABASE SERVICE, deliberately — the difference from every sibling
    # workflow in the tree. The canopy draws; it does not remember. If a future
    # change to this file adds a postgres service, the boundary it exists to
    # protect has already been crossed somewhere in src/.

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, iconv
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Code style (php-cs-fixer)
        run: composer cs:check

      - name: Static analysis (PHPStan max)
        run: composer phpstan

      # The scaffold suite. It is green and it stays green — a failure here is a
      # broken build, never a pending feature.
      - name: Tests (PHPUnit)
        run: composer test

      # THE RED SPECIFICATION, REPORTED AND NOT ENFORCED. tests/Phase2 describes
      # the socket contract that phase 2 extracts from the host; it fails today
      # because the templates and the manifest do not exist yet, which is the
      # point of writing it first. Running it here keeps the todo list visible
      # in every build without ever letting "red by design" be mistaken for
      # "broken" — the job does not fail on it.
      #
      # When the extraction lands, this step loses its `continue-on-error` and
      # the files move into tests/{Unit,Integration}.
      - name: Specification for phase 2 (expected to fail until the extraction)
        run: composer test:phase2
        continue-on-error: true
